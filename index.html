<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traco skill monster</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#f4f7f6] p-8 text[#333]">
    <header class="text-center p-6 bg-[#2d3436] text-white rounded-xl mb-6">
        <h1>Welcome to my world</h1>
    </header>
    <main class="max-w-2xl mx-auto flex flex-col items-center justify-center gap-6  px-4 w-full">
        <section class="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-indigo-500 w-full text-center flex flex-col items-center max-w-md transform hover:scale-105 transition duration-300">
            <h2 class="text-3xl font-extrabold mb-4 text-indigo-600 tracking-wide">About Me</h2>
            <p class="text-gray-600 leading-relaxed font-medium">I am an aspiring MERN stack developer. Exploring the world of code!</p>
            <img src="my.jpg"
             class="w-32 h-32 object-cover rounded-full shadow-md border-4 border-indigo-200 mb-4" alt="Traco Picture">
        </section>

        <section class="bg-white p-8 rounded-2xl shadow-md w-full text-center flex flex-col items-center">
            <h2 class="text-2xl font-bold mb-3">My skills</h2>
            <ol class="text-left list-decimal list-inside space-y-1 tex-gray-700">
                <li>Html 5</li>
                <li>Css 3</li>
                <li>Javascript</li>
            </ol>
        </section>

        <section class="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-emerald-500 w-full max-w-md mt-6">
            <h2 class="text-3xl font-extrabold mb-6 text-emerald-600 text-center tracking-wide">MY To Do List</h2>
            <div class="flex gap-2 mb-6">
                <input type="text" id="taskInput" placeholder="Add a new task..."
                class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-400 font-medium text-gray-700">
                <button id="addBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-3 rounded-xl shadow-md active:scale-95 transition duration-200">ADD</button>
            </div>

            <ul id="todoList" class="space-y-3 font-medium text-gray-700"></ul>
        </section>

        <section class="bg-white p-8 rounded-2xl shadow-md w-full text-center flex flex-col items-center">
            <h2 class="text-2xl font-bold mb-4">Message me</h2>
            <form id="myForm" class="w-full max-w-sm flex flex-col gap-4">
                <div class="flex flex-col text-left gap-1">
                    <label class="font-semibold text-gray-700" >Email:</label>
                    <input type="email" 
                    id="userEmail"  placeholder="example@gmail.com">
                </div>

                <div class="flex flex-col text-left gap-1">
                    <label class="font-semibold text-gray-700" >password:</label>
                    <input type="password" id="userPassword"
                    placeholder="Enter password">
                </div>
                <button type="submit" class="bg-[#2d3436] text-white py-3 rounded-xl font=bold hover:bg-black transition duration-300 mt-2" id="">Submit</button>
            </form>
        </section>

        <footer class="bg-yellow-500 hover:bg-yellow-600 px-4 py-2 text-black rounded-md">My own footer</footer>
    </main>
    <footer>
        <p>©2026 Traco. Developed with Mentor's Guidance.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
