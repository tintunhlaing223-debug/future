<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traco Skill Monster To-Do</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <section class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl border-t-4 border-emerald-500 w-full max-w-md">
        <h2 class="text-3xl font-extrabold mb-6 text-emerald-600 text-center tracking-wide">Traco's To Do</h2>
        
        <div class="mb-4">
            <input type="text" id="taskInput" placeholder="What you want to do today..." class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-400 font-medium text-gray-700">
        </div>

            <button id="addBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition duration-200 cursor-pointer">ADD</button>
        <ul id="todoList" class="space-y-3 font-medium text-gray-700 w-full"></ul>
    </section>
    <script src="script.js"></script>
</body>
</html>
